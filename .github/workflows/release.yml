name: Release (.exe)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconsole --onefile --name BuscadorCotizaciones --icon icono_cotizaciones.ico buscador_cotizaciones.py
      - run: Compress-Archive -Path dist\BuscadorCotizaciones.exe, config.toml, Manual_de_uso.pdf -DestinationPath BuscadorCotizaciones-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: BuscadorCotizaciones-windows.zip
          generate_release_notes: true

[project]
name = "buscador-cotizaciones-pc"
dynamic = ["version"]
description = "Lee cotizaciones en PDF de una carpeta y arma un Excel base comparativo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pdfplumber>=0.11", "openpyxl>=3.1", "reportlab>=4.0"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["actualizador", "agrupador", "buscador_cotizaciones", "clasificador", "consola", "correo",
              "excel_writer", "exportar_pdf", "extractor", "migracion", "ventana"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
testpaths = ["pruebas"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E741", "E743"]
